# A made-up checkout service with OpenTelemetry settings that look right and
# lose telemetry. Each mistake is one people make in real manifests.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-env
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318/v1/traces
  OTEL_E